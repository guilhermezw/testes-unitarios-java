spring:
  datasource:
    url: jdbc:h2:mem:calculadora_db
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: ${jwt.public.key}

  jwt:
    public:
      key: "classpath:app.pub"
    private:
      key: "classpath:app.key"

cors:
  origins: http://127.0.0.1:5500
